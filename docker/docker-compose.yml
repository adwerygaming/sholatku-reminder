services:

  db:
    container_name: sholatku-db
    image: postgres:18.2-alpine
    environment: 
      POSTGRES_DB: sholatku
      POSTGRES_USER: sholatku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: 
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5443:5432"
    networks:
      - sholatku-net

  redis:
    container_name: sholatku-redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    networks:
      - sholatku-net

volumes: 
  db_data:

networks:
  sholatku-net:
    name: sholatku-network