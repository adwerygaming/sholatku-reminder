name: Sholatku CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    linting:
        runs-on: ubuntu-latest

        steps:
        - name: "Checkout Repo"
          uses: actions/checkout@v4

        - name: "Install Node"
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: "Install dependencies"
          run: npm install

        - name: "Lint - Check for errors & unused vars"
          run: npm run lint
          
    typecheck:
      runs-on: ubuntu-latest
      needs: linting

      steps:
        - name: "Checkout Repo"
          uses: actions/checkout@v4

        - name: "Install Node"
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: "NPM CI Test"
          run: npm install

        - name: "Typescript Type Check"
          run: npx tsc --noEmit