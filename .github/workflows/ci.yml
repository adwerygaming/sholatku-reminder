name: Sholatku CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    linting:
        runs-on: ubuntu-latest

        steps:
        - name: "Checkout Repo"
          uses: actions/checkout@v4

        - name: "Install Node"
          uses: actions/setup-node@v3
          with:
            node-version: 24

        - name: "Install dependencies"
          run: npm install

        - name: "Lint - Check for errors & unused vars"
          run: |
            npx eslint .