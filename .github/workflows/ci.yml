name: Sholatku CI

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    linting:
        runs-on: ubuntu-latest

        steps:
        - name: "Checkout Repo"
          uses: actions/checkout@v4

        - name: "Install Node"
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm

        - name: "NPM CI Thingy"
          run: npm ci

        - name: "Lint - Check for errors & unused vars"
          run: npm run lint

    typecheck:
      runs-on: ubuntu-latest
      needs: linting

      steps:
        - name: "Checkout Repo"
          uses: actions/checkout@v4

        - name: "Install Node"
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm

        - name: "NPM CI Thingy"
          run: npm ci

        - name: "Typescript Type Check"
          run: npx tsc --noEmit